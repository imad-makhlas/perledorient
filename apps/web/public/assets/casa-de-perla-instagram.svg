<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title description">
  <title id="title">Casa de Perla</title>
  <description id="description">Logo Casa de Perla avec une maison arquée et une perle dorée.</description>
  <defs>
