  <text x="540" y="788" fill="#f7efe1" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="-2">Casa de <tspan fill="#c79a4a">Perla</tspan></text>
