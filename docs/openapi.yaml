openapi: 3.1.0
info:
  title: CODAvenue API
  version: 0.1.0
  description: Public catalogue and order endpoints for the CODAvenue vertical slice.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /health:
    get:
      summary: Service health
      responses:
        '200': { description: Healthy }
  /products:
    get:
      summary: List active product variants
      responses:
        '200':
          description: Active variants
  /orders:
    post:
      summary: Create a cash-on-delivery or WhatsApp order
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Persisted pending order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedOrder' }
        '400':
          description: Invalid customer, stock, variant, or payment method
  /orders/track:
    get:
      summary: Track an order using both order number and telephone
      parameters:
        - { in: query, name: orderNumber, required: true, schema: { type: string } }
        - { in: query, name: telephone, required: true, schema: { type: string } }
      responses:
        '200': { description: Matching order }
        '400': { description: No matching order }
components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [customer, items]
      properties:
        customer:
          type: object
          required: [firstName, lastName, telephone, city, address, paymentMethod, acceptedTerms]
          properties:
            firstName: { type: string }
            lastName: { type: string }
            telephone: { type: string }
            email: { type: string }
            city: { type: string }
            address: { type: string }
            postalCode: { type: string }
            deliveryNotes: { type: string }
            paymentMethod: { type: string, enum: [CASH_ON_DELIVERY, WHATSAPP] }
            acceptedTerms: { type: boolean }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [variantId, quantity]
            properties:
              variantId: { type: string }
              quantity: { type: integer, minimum: 1 }
    CreatedOrder:
      type: object
      properties:
        orderNumber: { type: string }
        subtotal: { type: number }
        deliveryFee: { type: number }
        total: { type: number }
        paymentMethod: { type: string }
        status: { type: string, enum: [PENDING_CONFIRMATION] }
        whatsappUrl: { type: [string, 'null'], format: uri }
