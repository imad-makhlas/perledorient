  </defs>

  <rect width="1080" height="1080" fill="url(#background)" />
  <circle cx="540" cy="540" r="458" fill="none" stroke="#c79a4a" stroke-opacity=".2" stroke-width="2" />
  <circle cx="540" cy="540" r="428" fill="none" stroke="#f7efe1" stroke-opacity=".07" stroke-width="1" />

