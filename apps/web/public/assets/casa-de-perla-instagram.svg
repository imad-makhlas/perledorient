      <stop offset="0.36" stop-color="#ead5aa" />
      <stop offset="1" stop-color="#b8893d" />
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".24" />
